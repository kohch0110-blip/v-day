<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yay! 🎉</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div class="hearts-bg"></div>

    <div class="container yes-container">
        <h1 class="yes-title">Knew you would say yes! 🎉</h1>

        <div class="gif-container">
            <img id="cat-gif" src="https://media.tenor.com/eNHbizSfVb0AAAAj/lovemode-cute.gif" alt="celebrating">
        </div>

        <div class="scattered-gallery">
            <img src="IMG_9961.jpg" class="gal-pic pic1">
            <img src="IMG_9962.jpg" class="gal-pic pic2">
            <img src="IMG_9963.jpg" class="gal-pic pic3">
            <img src="IMG_9964.jpg" class="gal-pic pic4">
            <img src="IMG_9965.jpg" class="gal-pic pic5">
            <img src="IMG_9966.jpg" class="gal-pic pic6">
            <img src="IMG_9967.jpg" class="gal-pic pic7">
        </div>

        <p class="yes-message">Happy 3rd Anniversary, My 臭人! 💕</p>
    </div>

    <audio id="bg-music" loop>
        <source src="music/beabadoobee - Glue Song (Lyrics).mp3" type="audio/mpeg">
    </audio>

    <button id="music-toggle" onclick="toggleMusic()" title="Toggle music">🔊</button>

    <script src="yes-script.js"></script>
</body>
</html>
